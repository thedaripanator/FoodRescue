<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FoodRescue Google Login Test</title>
</head>

<body>

<h2>FoodRescue Google Login Test</h2>

<div id="g_id_onload"
     data-client_id="563566513878-4lsnfa3ql81en03j6fnhk63iudpj8nfb.apps.googleusercontent.com"
     data-callback="handleCredentialResponse">
</div>

<div class="g_id_signin"
     data-type="standard"
     data-size="large"
     data-theme="outline"
     data-text="signin_with"
     data-shape="rectangular">
</div>

<br>

<pre id="result">
Waiting for Google login...
</pre>


<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client"
        async
        defer>
</script>


<script>

    async function handleCredentialResponse(response) {

        console.log("Google callback triggered");

        /*
         * Google returns the ID token
         * in response.credential
         */
        const idToken = response.credential;

        console.log(
            "Token received:",
            !!idToken
        );

        /*
         * Safe debugging.
         *
         * We do NOT print the actual token.
         */
        console.log(
            "Token parts:",
            idToken
                ? idToken.split(".").length
                : 0
        );

        document.getElementById("result").textContent =
            "Google token received.\n" +
            "Sending token to Spring Boot...";


        try {

            /*
             * Send Google ID token
             * to Spring Boot
             */
            const backendResponse =
                await fetch(
                    "http://localhost:8082/api/auth/google",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            idToken: idToken
                        })
                    }
                );


            /*
             * Read backend response
             */
            const data =
                await backendResponse.json();


            /*
             * Display backend response
             */
            document.getElementById("result")
                .textContent =
                    JSON.stringify(
                        data,
                        null,
                        2
                    );


            console.log(
                "Spring Boot response:",
                data
            );

        } catch (error) {

            console.error(
                "Backend request failed:",
                error
            );

            document.getElementById("result")
                .textContent =
                    "Backend request failed:\n" +
                    error.message;
        }
    }

</script>

</body>

</html>
